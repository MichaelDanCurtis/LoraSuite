[project]
name = "lorasuite-engine"
version = "0.1.0"
description = "Local media engine for LoraSuite"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40",
  "certifi>=2026.10.19",
  "fastapi>=0.115",
  "gallery-dl>=1.30",
  "numpy>=1.26",
  "opencv-python-headless>=5.0,<6",
  "pillow>=13.0.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "pyobjc-framework-Vision>=12.2,<13; platform_system == 'Darwin'",
  "python-multipart>=0.0.20",
  "sherpa-onnx>=1.13.4",
  "sherpa-onnx-bin>=1.13.4",
  "soundfile>=0.14",
  "urllib3>=2.8.0",
  "uvicorn[standard]>=0.30",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pyinstaller==6.21.0",
  "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"lorasuite_engine.comfyui_extension" = ["README.md", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
